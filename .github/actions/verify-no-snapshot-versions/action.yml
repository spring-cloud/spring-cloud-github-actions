name: 'Verify No Snapshot Versions'
description: 'Verifies that every version in every Maven and Gradle build file in a Spring Cloud project is a release version (no -SNAPSHOT, and no -RC*/-M* unless allow-prerelease is set), wherever it is declared'
author: 'Spring Cloud Team'

inputs:
  allow-prerelease:
    description: >
      Permit -M<n> and -RC<n> versions. Set this when verifying a milestone or release
      candidate: such a build legitimately carries a mixture of milestone,
      release-candidate and GA versions, and the default would reject every one of them.
      -SNAPSHOT is rejected either way.
    required: false
    default: 'false'
  directory:
    description: 'Root directory of the project to verify. Defaults to the current working directory.'
    required: false
    default: '.'
  exclude-patterns:
    description: 'Newline-separated list of regular expressions. Any file whose absolute path matches one of these patterns is excluded from version checking.'
    required: false
    default: |
      ^.*\.git/.*$
      ^.*spring-cloud-contract-maven-plugin/src/test/projects/.*$
      ^.*spring-cloud-contract-maven-plugin/target/.*$
      ^.*spring-cloud-contract-gradle-plugin/src/test/.*$
      ^.*src/test/bats/.*$
      ^.*samples/standalone/[a-z]+/.*$

outputs:
  violations:
    description: 'JSON array of violation objects, each with file, location, and version fields. Empty array when all versions are release versions.'

runs:
  using: node20
  main: dist/index.js

branding:
  icon: 'check-circle'
  color: 'green'

name: 'Update Commercial Repositories'
description: 'Replaces Spring OSS repo.spring.io repository references with commercial Broadcom Artifactory repositories in POM and Gradle files'
author: 'Spring Cloud Team'

inputs:
  repository:
    description: 'Commercial repository to update (format: org/repo-name)'
    required: true
  branch:
    description: 'Branch to update'
    required: true
  token:
    description: 'GitHub token with contents: write permission on the repository'
    required: true
  add-snapshot-repo:
    description: 'When true, also add https://repo.spring.io/snapshot as a snapshot-only repository (no releases). Use when creating an OSS release branch that needs snapshot dependencies.'
    required: false
    default: 'false'
  keep-oss-repositories:
    description: 'When true, POM <repositories>/<pluginRepositories> blocks keep their existing old repo.spring.io entries (snapshots, milestones, release) after the commercial ones, so a build can resolve both commercial and OSS-only artifacts. Fails if a kept entry has the same id as a commercial repository. Has no effect on Gradle files. Use for hotfix branches, whose dependencies mix commercial hotfix releases with OSS-only releases.'
    required: false
    default: 'false'
  commit-message:
    description: 'Commit message for the repository updates'
    required: false
    default: 'Updating repositories to commercial Broadcom repositories [skip actions]'
  git-user-name:
    description: 'Git author name for the commit'
    required: false
    default: 'Spring Builds'
  git-user-email:
    description: 'Git author email for the commit'
    required: false
    default: 'svc.spring-builds@broadcom.com'

runs:
  using: node20
  main: dist/index.js

branding:
  icon: 'database'
  color: 'green'

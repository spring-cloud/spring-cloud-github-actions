name: 'Add Commercial Release Files'
description: >
  Adds ci-release.yml and release-ci-settings.xml to a commercial OSS release
  branch.  These two files replace all source-code modifications that were
  previously committed during initialization (pom.xml repo changes, distribution
  management changes, ci.yml edits).  Both files are deleted by
  spring-release-train-project-ready before the release is finalised, so they
  never appear in the OSS repo history.
author: 'Spring Cloud Team'

inputs:
  repository:
    description: 'Commercial repository to add files to (format: org/repo-name)'
    required: true
  branch:
    description: 'Commercial release branch to add files to (e.g. release/5.0.3)'
    required: true
  token:
    description: 'GitHub token with contents: write permission on the repository'
    required: true
  retarget-ci-release-from:
    description: >
      Branch name to rewrite out of an inherited ci-release.yml. Set to the
      <major>.<minor>.x-internal branch when initialising a release/<version> branch: the
      release branch is cut from the internal branch and so arrives carrying its
      ci-release.yml, which still names the internal branch in the push trigger. Rewriting
      the references retargets the file at this branch while keeping whatever pipeline the
      internal branch uses, which the generic template cannot always express.

      When empty, or when the branch has no ci-release.yml, the generic template is used.
    required: false
    default: ''
  preserve-existing-ci-release:
    description: >
      Set to "true" to keep an existing .github/workflows/ci-release.yml instead of
      regenerating it. Use for the long-lived <major>.<minor>.x-internal branch, which is
      re-initialised on every release in the line and which some projects tailor
      (spring-cloud-kubernetes delegates to its own sharded maven.yaml).

      Must stay false for release/<version> branches: they are cut from the internal branch
      and therefore inherit its ci-release.yml, whose push trigger names the internal
      branch. Regenerating is what points the trigger at the release branch.
    required: false
    default: 'false'
  actions-ref:
    description: >
      Tag of spring-cloud-github-actions the generated ci-release.yml should call.
      Empty (the default) resolves the latest published release and pins its commit
      SHA, so a new branch is born pinned rather than tracking a moving ref.
    required: false
    default: ''
  commit-message:
    description: 'Commit message'
    required: false
    default: 'Add commercial release CI files [skip actions]'
  git-user-name:
    description: 'Git author name for the commit'
    required: false
    default: 'Spring Builds'
  git-user-email:
    description: 'Git author email for the commit'
    required: false
    default: 'svc.spring-builds@broadcom.com'

runs:
  using: 'composite'
  steps:
    # Relative ref: this action is only invoked from workflows in this repository,
    # which check it out first - the same pattern spring-release-train-project-ready
    # already uses.
    - name: Resolve the actions ref to generate
      id: actions-ref
      uses: ./.github/actions/resolve-actions-ref
      with:
        ref: ${{ inputs.actions-ref }}
        token: ${{ inputs.token }}

    - name: Add ci-release.yml and release-ci-settings.xml
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTIONS_REF: ${{ steps.actions-ref.outputs.pinned-ref }}
      run: |
        REPO="${{ inputs.repository }}"
        BRANCH="${{ inputs.branch }}"

        echo "=== Add Commercial Release Files ==="
        echo "Repository: $REPO"
        echo "Branch:     $BRANCH"
        echo ""

        git clone --single-branch --branch "$BRANCH" \
          "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" _commercial_files_repo

        cd _commercial_files_repo

        git config user.name "${{ inputs.git-user-name }}"
        git config user.email "${{ inputs.git-user-email }}"

        # ── ci-release.yml ───────────────────────────────────────────────────────
        # Provides a dedicated CI workflow for this commercial release branch.
        # trigger-branch-ci dispatches this file in preference to ci.yml so the
        # original ci.yml never needs to be modified.
        #
        # Three modes, so that the generic template is only ever the starting point:
        #
        #   retarget  (retarget-ci-release-from set, file present)
        #     The branch was cut from the -internal branch and so already carries its
        #     ci-release.yml, referring to the -internal branch. Rewrite those references to
        #     name this branch and keep everything else. Whatever pipeline the -internal
        #     branch uses therefore carries into the release branch, including project
        #     specific ones the template cannot express: spring-cloud-kubernetes delegates to
        #     its own sharded maven.yaml, which the generic template would run as a single
        #     job and time out.
        #
        #   preserve  (preserve-existing-ci-release true, file present)
        #     Leave the file completely alone. Used for the -internal branch, which is
        #     re-initialised on every release in the line and may have been tailored.
        #     Note that a branch keeping its own copy stops picking up template
        #     improvements, so the skip is logged prominently rather than quietly.
        #
        #   generate  (otherwise)
        #     Write the generic template. This is the first-time path for a new -internal
        #     branch.
        CI_RELEASE_FILE=.github/workflows/ci-release.yml
        RETARGET_FROM="${{ inputs.retarget-ci-release-from }}"

        if [[ -n "$RETARGET_FROM" && -f "$CI_RELEASE_FILE" ]]; then
          CI_RELEASE_MODE=retarget
        elif [[ "${{ inputs.preserve-existing-ci-release }}" == "true" && -f "$CI_RELEASE_FILE" ]]; then
          CI_RELEASE_MODE=preserve
        else
          CI_RELEASE_MODE=generate
        fi
        echo "ci-release.yml mode: ${CI_RELEASE_MODE}"

        # D/L/R split the GitHub Actions expression delimiter into three bash
        # variables so the template parser never sees a literal dollar-brace-brace
        # in this file (composite actions cannot access the secrets context).
        D='$' L='{{' R='}}'

        mkdir -p .github/workflows
        cat > /tmp/ci-release-generated.yml << 'WORKFLOW_EOF'
        name: Spring Cloud CI Job (Commercial Release Branch)

        on:
          workflow_dispatch:
            inputs:
              branches:
                description: "Which branch should be built (can be a comma-separated list of branches)"
                required: true
                default: 'RELEASE_BRANCH_PLACEHOLDER'
                type: string
          push:
            branches:
              - RELEASE_BRANCH_PLACEHOLDER

        permissions:
          actions: write
          contents: read

        jobs:
          deploy:
            uses: spring-cloud/spring-cloud-github-actions/.github/workflows/deploy.yml@ACTIONS_REF_PLACEHOLDER
            with:
              branches: EXPR_inputs.branches_EXPR
              # Commercial Artifactory only serves runners in the spring-enterprise-builds
              # group and refuses anything else with a 403, before authentication is even
              # attempted. This branch resolves its dependencies from there, so a
              # GitHub-hosted runner will fail no matter how the credentials are set up.
              runs_on: ubuntu22-2-8
              # The branches this workflow builds carry -INTERNAL-SNAPSHOT versions until
              # release-train-ready stamps the release versions. The antora-component-version
              # plugin derives the component version by stripping only -SNAPSHOT, producing
              # e.g. 5.0.3-INTERNAL, which @springio/antora-extensions cannot parse. Building
              # the docs profile would fail, so it is disabled here.
              build_docs: false
            secrets:
              ARTIFACTORY_USERNAME: EXPR_secrets.ARTIFACTORY_USERNAME_EXPR
              ARTIFACTORY_PASSWORD: EXPR_secrets.ARTIFACTORY_PASSWORD_EXPR
              COMMERCIAL_ARTIFACTORY_USERNAME: EXPR_secrets.COMMERCIAL_ARTIFACTORY_USERNAME_EXPR
              COMMERCIAL_ARTIFACTORY_PASSWORD: EXPR_secrets.COMMERCIAL_ARTIFACTORY_PASSWORD_EXPR
              DOCKERHUB_USERNAME: EXPR_secrets.DOCKERHUB_USERNAME_EXPR
              DOCKERHUB_TOKEN: EXPR_secrets.DOCKERHUB_TOKEN_EXPR
        WORKFLOW_EOF

        # Substitute placeholders with real values.
        # Note: YAML already strips the block scalar's leading indentation before
        # running this script, so no space-stripping sed pass is needed here.
        sed -i \
          -e "s|ACTIONS_REF_PLACEHOLDER|${ACTIONS_REF}|g" \
          -e "s|RELEASE_BRANCH_PLACEHOLDER|${BRANCH}|g" \
          -e "s|EXPR_\(.*\)_EXPR|${D}${L} \1 ${R}|g" \
          /tmp/ci-release-generated.yml

        case "$CI_RELEASE_MODE" in
          retarget)
            # Every reference is the literal branch name: the workflow_dispatch default, the
            # push trigger, and for a delegating file the branch input passed to the
            # project's own workflow. A plain substitution covers all of them.
            hits=$(grep -c -- "${RETARGET_FROM}" "$CI_RELEASE_FILE" || true)
            if [[ "$hits" -eq 0 ]]; then
              echo "::warning title=ci-release.yml not retargeted::Inherited ci-release.yml on ${BRANCH} contains no reference to ${RETARGET_FROM}, so its push trigger may not name this branch. Check it by hand."
            fi
            sed -i "s|${RETARGET_FROM}|${BRANCH}|g" "$CI_RELEASE_FILE"
            echo "Retargeted ${CI_RELEASE_FILE} from ${RETARGET_FROM} to ${BRANCH} (${hits} reference(s))."
            ;;
          preserve)
            echo "::notice title=ci-release.yml preserved::.github/workflows/ci-release.yml already exists on ${BRANCH} and was left unchanged. If the template has changed, apply it to this branch by hand."
            echo ""
            echo "  ci-release.yml already present on ${BRANCH} — keeping the existing file."
            echo "  Delete it from the branch first if you want the generated template back."
            echo ""
            # Show what would have been written so a drifted branch is diagnosable from the log.
            if ! diff -q "$CI_RELEASE_FILE" /tmp/ci-release-generated.yml > /dev/null 2>&1; then
              echo "The existing ci-release.yml differs from the generated template:"
              diff "$CI_RELEASE_FILE" /tmp/ci-release-generated.yml || true
              echo ""
            else
              echo "The existing ci-release.yml is identical to the generated template."
            fi
            ;;
          generate)
            cp /tmp/ci-release-generated.yml "$CI_RELEASE_FILE"
            echo "Generated ${CI_RELEASE_FILE}"
            ;;
        esac

        # ── release-ci-settings.xml ──────────────────────────────────────────────
        # Copies the canonical commercial Maven settings template from the
        # spring-cloud-github-actions workspace into the release branch root.
        # deploy.yml uses --settings release-ci-settings.xml when this file is
        # present, adding commercial repos via the 'spring' profile without any
        # pom.xml changes.
        SETTINGS_TEMPLATE="${GITHUB_WORKSPACE}/config/release-ci-settings.xml"
        if [[ ! -f "$SETTINGS_TEMPLATE" ]]; then
          echo "ERROR: $SETTINGS_TEMPLATE not found in spring-cloud-github-actions workspace."
          exit 1
        fi
        cp "$SETTINGS_TEMPLATE" release-ci-settings.xml
        echo "Copied config/release-ci-settings.xml → release-ci-settings.xml"

        # ── Commit and push ──────────────────────────────────────────────────────
        git add .github/workflows/ci-release.yml release-ci-settings.xml

        if git diff --cached --quiet; then
          echo "Files are already present and identical — nothing to commit."
          exit 0
        fi

        git commit -m "${{ inputs.commit-message }}"
        git push origin "$BRANCH"

        echo ""
        echo "Commercial release files committed to '${BRANCH}'."

branding:
  icon: 'package'
  color: 'blue'

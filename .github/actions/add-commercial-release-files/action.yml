name: 'Add Commercial Release Files'
description: >
  Adds ci-release.yml and release-ci-settings.xml to a commercial OSS release
  branch.  These two files replace all source-code modifications that were
  previously committed during initialization (pom.xml repo changes, distribution
  management changes, ci.yml edits).  Both files are deleted by
  spring-release-train-project-ready before the release is finalised, so they
  never appear in the OSS repo history.
author: 'Spring Cloud Team'

inputs:
  repository:
    description: 'Commercial repository to add files to (format: org/repo-name)'
    required: true
  branch:
    description: 'Commercial release branch to add files to (e.g. release/5.0.3)'
    required: true
  token:
    description: 'GitHub token with contents: write permission on the repository'
    required: true
  commit-message:
    description: 'Commit message'
    required: false
    default: 'Add commercial release CI files [skip actions]'
  git-user-name:
    description: 'Git author name for the commit'
    required: false
    default: 'Spring Builds'
  git-user-email:
    description: 'Git author email for the commit'
    required: false
    default: 'svc.spring-builds@broadcom.com'

runs:
  using: 'composite'
  steps:
    - name: Add ci-release.yml and release-ci-settings.xml
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        REPO="${{ inputs.repository }}"
        BRANCH="${{ inputs.branch }}"

        echo "=== Add Commercial Release Files ==="
        echo "Repository: $REPO"
        echo "Branch:     $BRANCH"
        echo ""

        git clone --single-branch --branch "$BRANCH" \
          "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" _commercial_files_repo

        cd _commercial_files_repo

        git config user.name "${{ inputs.git-user-name }}"
        git config user.email "${{ inputs.git-user-email }}"

        # ── ci-release.yml ───────────────────────────────────────────────────────
        # Generates a dedicated CI workflow for this commercial release branch.
        # trigger-branch-ci dispatches this file in preference to ci.yml so the
        # original ci.yml never needs to be modified.
        #
        # D/L/R split the GitHub Actions expression delimiter into three bash
        # variables so the template parser never sees a literal dollar-brace-brace
        # in this file (composite actions cannot access the secrets context).
        D='$' L='{{' R='}}'

        mkdir -p .github/workflows
        cat > .github/workflows/ci-release.yml << 'WORKFLOW_EOF'
        name: Spring Cloud CI Job (Commercial Release Branch)

        on:
          workflow_dispatch:
            inputs:
              branches:
                description: "Which branch should be built (can be a comma-separated list of branches)"
                required: true
                default: 'RELEASE_BRANCH_PLACEHOLDER'
                type: string
          push:
            branches:
              - RELEASE_BRANCH_PLACEHOLDER

        permissions:
          actions: write
          contents: read

        jobs:
          deploy:
            uses: spring-cloud/spring-cloud-github-actions/.github/workflows/deploy.yml@main
            with:
              branches: EXPR_inputs.branches_EXPR
              runs_on: ubuntu22-2-8
              # The branches this workflow builds carry -INTERNAL-SNAPSHOT versions until
              # release-train-ready stamps the release versions. The antora-component-version
              # plugin derives the component version by stripping only -SNAPSHOT, producing
              # e.g. 5.0.3-INTERNAL, which @springio/antora-extensions cannot parse. Building
              # the docs profile would fail, so it is disabled here.
              build_docs: false
            secrets:
              ARTIFACTORY_USERNAME: EXPR_secrets.ARTIFACTORY_USERNAME_EXPR
              ARTIFACTORY_PASSWORD: EXPR_secrets.ARTIFACTORY_PASSWORD_EXPR
              COMMERCIAL_ARTIFACTORY_USERNAME: EXPR_secrets.COMMERCIAL_ARTIFACTORY_USERNAME_EXPR
              COMMERCIAL_ARTIFACTORY_PASSWORD: EXPR_secrets.COMMERCIAL_ARTIFACTORY_PASSWORD_EXPR
              DOCKERHUB_USERNAME: EXPR_secrets.DOCKERHUB_USERNAME_EXPR
              DOCKERHUB_TOKEN: EXPR_secrets.DOCKERHUB_TOKEN_EXPR
        WORKFLOW_EOF

        # Substitute placeholders with real values.
        # Note: YAML already strips the block scalar's leading indentation before
        # running this script, so no space-stripping sed pass is needed here.
        sed -i \
          -e "s|RELEASE_BRANCH_PLACEHOLDER|${BRANCH}|g" \
          -e "s|EXPR_\(.*\)_EXPR|${D}${L} \1 ${R}|g" \
          .github/workflows/ci-release.yml

        echo "Generated .github/workflows/ci-release.yml"

        # ── release-ci-settings.xml ──────────────────────────────────────────────
        # Copies the canonical commercial Maven settings template from the
        # spring-cloud-github-actions workspace into the release branch root.
        # deploy.yml uses --settings release-ci-settings.xml when this file is
        # present, adding commercial repos via the 'spring' profile without any
        # pom.xml changes.
        SETTINGS_TEMPLATE="${GITHUB_WORKSPACE}/config/release-ci-settings.xml"
        if [[ ! -f "$SETTINGS_TEMPLATE" ]]; then
          echo "ERROR: $SETTINGS_TEMPLATE not found in spring-cloud-github-actions workspace."
          exit 1
        fi
        cp "$SETTINGS_TEMPLATE" release-ci-settings.xml
        echo "Copied config/release-ci-settings.xml → release-ci-settings.xml"

        # ── Commit and push ──────────────────────────────────────────────────────
        git add .github/workflows/ci-release.yml release-ci-settings.xml

        if git diff --cached --quiet; then
          echo "Files are already present and identical — nothing to commit."
          exit 0
        fi

        git commit -m "${{ inputs.commit-message }}"
        git push origin "$BRANCH"

        echo ""
        echo "Commercial release files committed to '${BRANCH}'."

branding:
  icon: 'package'
  color: 'blue'

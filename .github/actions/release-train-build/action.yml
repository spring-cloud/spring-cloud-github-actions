name: Build Release
runs:
  using: composite
  steps:
    - name: Build Release
      shell: bash
      run: |
        profiles="releaseTrain"
        java_version=$(java -version 2>&1 | head -1 | awk -F '"' '{print $2}')
        if [[ "$java_version" == 1.8* ]]; then
#         If we are using JDK 8 we are building a Jubilee project and the docs zip needs to be build and distributed by the orchestrator
          profiles="${profiles},docs"
        fi
        ./mvnw --no-transfer-progress --batch-mode --settings release-train-settings.xml clean deploy --activate-profiles "${profiles}" -DaltDeploymentRepository="release-train::default::file://$(pwd)/deployment-repository" -DskipTests
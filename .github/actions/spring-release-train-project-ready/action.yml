name: 'Spring Release Train Project Ready'
description: >
  Checks out a Spring Cloud project release branch, updates dependency versions from the
  release train, verifies no pre-release versions remain, commits and pushes the changes,
  then triggers the project's release-train-ready.yml workflow and waits for it to complete.
  Finally removes the release branch from the Antora playbook (docs-build branch).
author: 'Spring Cloud Team'

inputs:
  project:
    description: >
      The spring-cloud GitHub project name (e.g. spring-cloud-config or
      spring-cloud-config-commercial). The action checks out
      spring-cloud/<project> at branch release/<project-version>.
    required: true
  project-version:
    description: >
      The version of the project being released (e.g. 4.2.0). Used to
      identify the release/<project-version> branch to check out.
    required: true
  spring-cloud-release-train-version:
    description: >
      The Spring Cloud release train version that matches the properties file
      in the jenkins-releaser-config branch of spring-cloud-release
      (e.g. 2025.0.0). Passed to update-project-versions to resolve
      dependency versions.
    required: true
  spring-release-train-version:
    description: >
      The Spring release train version to mark this project as ready in
      (e.g. 2026.07). Passed as the release-train input to the
      release-train-ready.yml workflow on the project.
    required: true
  token:
    description: >
      GitHub token used for checking out the project, pushing commits, and
      dispatching the workflow. The calling workflow should pass the
      secrets.GH_ACTIONS_REPO_TOKEN secret here.
    required: true

runs:
  using: composite
  steps:
    - name: Validate version against jenkins-releaser-config
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        project="${{ inputs.project }}"
        project_version="${{ inputs.project-version }}"
        release_train_version="${{ inputs.spring-cloud-release-train-version }}"

        # Where the config lives, the file name, and the lookup all come from the shared
        # module - it owns that choice for every caller, and it is always
        # spring-cloud-release-commercial, for OSS releases too. Only the project repository
        # checked out below is selected by the -commercial suffix; the properties key is the
        # plain project name, which the module strips for us.
        #
        # GITHUB_ACTION_PATH rather than the workspace so this works for external callers,
        # the way dependabot-scan reaches prerelease-rank.js.
        script="${GITHUB_ACTION_PATH}/../../scripts/releaser-config.js"

        # rc captured through || rather than read from $? after an `if !`, where $? is the
        # result of the negation and always 0 - which would swallow the exit code the script
        # uses to say *why* it failed.
        rc=0
        config_version=$(node "$script" "$release_train_version" "$project") || rc=$?
        if [[ "$rc" -ne 0 ]]; then
          case "$rc" in
            3) echo "ERROR: no properties file for release train '${release_train_version}' in"
               echo "spring-cloud-release-commercial@jenkins-releaser-config." ;;
            4) echo "ERROR: '${project%-commercial}' is not part of release train '${release_train_version}'." ;;
            *) echo "ERROR: could not read the releaser config (exit ${rc})." ;;
          esac
          exit 1
        fi

        echo "Version in jenkins-releaser-config: ${config_version}"
        echo "Version in branch name:             ${project_version}"

        if [[ "$config_version" != "$project_version" ]]; then
          echo "ERROR: Version mismatch!"
          echo "  Branch name expects:     release/${project_version}"
          echo "  jenkins-releaser-config: ${config_version}"
          echo "  Check that spring-cloud-release-train-version is correct."
          exit 1
        fi

        echo "Version check passed: ${base_project} = ${project_version}"

    - name: Checkout project release branch
      uses: actions/checkout@v4
      with:
        repository: spring-cloud/${{ inputs.project }}
        ref: release/${{ inputs.project-version }}
        token: ${{ inputs.token }}
        path: ${{ inputs.project }}

    - name: Update project versions
      uses: ./.github/actions/update-project-versions
      with:
        release-train-version: ${{ inputs.spring-cloud-release-train-version }}
        # Hardcoded true, not the project's flavour. This input does one thing in the action
        # - pick which repository the releaser config is fetched from - and that is always
        # spring-cloud-release-commercial, matching the version check above. Passing the
        # derived value would validate against one file and stamp from another.
        commercial: 'true'
        token: ${{ inputs.token }}
        directory: ${{ inputs.project }}

    - name: Delete CI and PR workflows from release branch
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        for workflow in "ci.yml" "ci.yaml" "pr.yml" "pr.yaml" "ci-release.yml"; do
          if [[ -f ".github/workflows/${workflow}" ]]; then
            git rm ".github/workflows/${workflow}"
            echo "Staged .github/workflows/${workflow} for deletion."
          else
            echo ".github/workflows/${workflow} not found — skipping."
          fi
        done
        if [[ -f "release-ci-settings.xml" ]]; then
          git rm "release-ci-settings.xml"
          echo "Staged release-ci-settings.xml for deletion."
        else
          echo "release-ci-settings.xml not found — skipping."
        fi

    # A milestone or release candidate stamps -M<n>/-RC<n> versions on purpose, and its
    # dependencies are a mixture of milestone, release-candidate and GA versions. Only
    # -SNAPSHOT is always wrong, so the milestone half of the check is turned off for a
    # pre-release. Derived from the version being released rather than taken as an input:
    # the two can never legitimately disagree.
    - name: Verify no snapshot versions
      uses: ./.github/actions/verify-no-snapshot-versions
      with:
        directory: ${{ inputs.project }}
        allow-prerelease: ${{ contains(inputs.project-version, '-M') || contains(inputs.project-version, '-RC') }}

    - name: Commit and push changes
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        git config user.name "spring-builds"
        git config user.email "spring-builds@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Release ${{ inputs.project-version }}"
          git push
          echo "Committed and pushed changes."
        fi

    - name: Trigger release-train-ready workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        run_url=$(gh workflow run release-train-ready.yml \
          --repo spring-cloud/${{ inputs.project }} \
          --ref release/${{ inputs.project-version }} \
          --field release-train=${{ inputs.spring-release-train-version }} \
          --field release-train-repository=spring-io/release-train)
        echo "Dispatched workflow run. Waiting for $run_url to complete."
        run_id=${run_url##*/}
        watch_exit_code=0
        gh run watch $run_id --repo spring-cloud/${{ inputs.project }} --exit-status --interval=3 > /dev/null 2>&1 || watch_exit_code=$?
        if [[ $watch_exit_code -eq 0 ]]; then
          echo "Workflow run succeeded."
        else
          echo "Workflow run failed."
        fi
        exit $watch_exit_code

    - name: Remove release branch from Antora playbook
      uses: ./.github/actions/update-antora-playbook
      with:
        repository: spring-cloud/${{ inputs.project }}
        branch: release/${{ inputs.project-version }}
        operation: remove
        token: ${{ inputs.token }}

branding:
  icon: 'check-square'
  color: 'green'

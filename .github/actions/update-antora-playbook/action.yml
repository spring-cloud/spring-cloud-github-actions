name: 'Update Antora Playbook'
description: >
  Adds or removes a commercial branch in the Antora playbook on the docs-build
  branch. On add, adjusts content.sources.branches and content.sources.tags so
  the branch and its release tags are included in documentation builds. On
  remove, drops the branch from content.sources.branches (tags are left as-is).
author: 'Spring Cloud Team'

inputs:
  repository:
    description: 'Commercial repository whose docs-build branch contains the Antora playbook (format: org/repo-name)'
    required: true
  branch:
    description: 'Commercial branch to add to or remove from the playbook'
    required: true
  operation:
    description: "Whether to 'add' the branch to the playbook or 'remove' it"
    required: false
    default: 'add'
  token:
    description: 'GitHub token with contents: write permission on the repository'
    required: true
  docs-build-branch:
    description: 'Branch that holds the Antora playbook'
    required: false
    default: 'docs-build'
  commit-message:
    description: 'Commit message for the playbook update. Defaults to an operation-specific message when empty.'
    required: false
    default: ''
  git-user-name:
    description: 'Git author name for the commit'
    required: false
    default: 'Spring Builds'
  git-user-email:
    description: 'Git author email for the commit'
    required: false
    default: 'svc.spring-builds@broadcom.com'

runs:
  using: node20
  main: dist/index.js

branding:
  icon: 'book-open'
  color: 'blue'

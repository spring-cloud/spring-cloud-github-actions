name: 'Update Distribution Management'
description: 'Replaces <repository>/<snapshotRepository> in Maven distributionManagement with commercial Broadcom entries and removes central-publishing-maven-plugin references'
author: 'Spring Cloud Team'

inputs:
  repository:
    description: 'Commercial repository to update (format: org/repo-name)'
    required: true
  branch:
    description: 'Branch to update'
    required: true
  token:
    description: 'GitHub token with contents: write permission on the repository'
    required: true
  commit-message:
    description: 'Commit message for the distribution management updates'
    required: false
    default: 'Updating distribution management for commercial repo [skip actions]'
  git-user-name:
    description: 'Git author name for the commit'
    required: false
    default: 'Spring Builds'
  git-user-email:
    description: 'Git author email for the commit'
    required: false
    default: 'svc.spring-builds@broadcom.com'

runs:
  using: node20
  main: dist/index.js

branding:
  icon: 'upload-cloud'
  color: 'blue'

name: 'Generate Workflows for Branch'
description: >
  Copies release-train action files, downloads the github-actions-workflow-generator
  JAR, runs the generator on the given repository branch, and commits/pushes any
  resulting changes.

inputs:
  repo:
    description: 'Full repository path (e.g. spring-cloud/spring-cloud-stream-commercial)'
    required: true
  branch:
    description: 'Branch to generate workflows for (e.g. release/5.0.2.1)'
    required: true
  primary-jdk:
    description: 'Primary JDK version passed to the generator (e.g. 17)'
    required: false
    default: '17'
  generator-version:
    description: >
      Version of github-actions-workflow-generator to use.
      Defaults to the latest release when not supplied.
    required: false
    default: ''
  token:
    description: 'GitHub token with write access to the target repository'
    required: true

outputs:
  changed:
    description: "'true' if workflow files were changed and pushed, 'false' otherwise"
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Resolve generator version
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        if [[ -n "${{ inputs.generator-version }}" ]]; then
          version="${{ inputs.generator-version }}"
        else
          tag=$(gh api repos/spring-io/github-actions-workflow-generator/releases/latest --jq '.tag_name')
          version="${tag#v}"
        fi
        url="https://github.com/spring-io/github-actions-workflow-generator/releases/download/v${version}/github-actions-workflow-generator-${version}.jar"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "url=${url}"         >> "$GITHUB_OUTPUT"
        echo "Generator version: ${version}"
        echo "Download URL:      ${url}"

    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        distribution: liberica
        java-version: '25'

    - name: Download generator JAR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version="${{ steps.resolve.outputs.version }}"
        gh release download "v${version}" \
          --repo spring-io/github-actions-workflow-generator \
          --pattern "github-actions-workflow-generator-${version}.jar" \
          --output _gen_generator.jar
        echo "Downloaded github-actions-workflow-generator ${version}"

    - name: Clone repository
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        git clone --depth 1 --branch "${{ inputs.branch }}" \
          "https://x-access-token:${TOKEN}@github.com/${{ inputs.repo }}.git" _gen_repo
        git -C _gen_repo config user.email "spring-builds@users.noreply.github.com"
        git -C _gen_repo config user.name "spring-builds"

    - name: Copy release-train actions
      shell: bash
      env:
        REPO:   ${{ inputs.repo }}
        BRANCH: ${{ inputs.branch }}
      run: |
        # Derive the OSS project name: strip org prefix and -commercial suffix
        project="${REPO#spring-cloud/}"
        project="${project%-commercial}"

        workspace="${GITHUB_WORKSPACE}"
        overrides_root="${workspace}/config/release-train-actions"

        for action in release-train-build release-train-test; do
          dest="_gen_repo/.github/actions/${action}/action.yml"
          mkdir -p "$(dirname "$dest")"

          # 1. Branch-specific override
          branch_src="${overrides_root}/${project}/${BRANCH}/${action}/action.yml"
          # 2. Project-level override
          project_src="${overrides_root}/${project}/${action}/action.yml"
          # 3. Global default
          default_src="${workspace}/.github/actions/${action}/action.yml"

          if [[ -f "$branch_src" ]]; then
            cp "$branch_src" "$dest"
            echo "  ${action}: copied branch-specific override (${project}/${BRANCH})"
          elif [[ -f "$project_src" ]]; then
            cp "$project_src" "$dest"
            echo "  ${action}: copied project-level override (${project})"
          else
            cp "$default_src" "$dest"
            echo "  ${action}: copied global default"
          fi
        done

        # Copy release-train-settings.xml to the commercial repo root so
        # ./mvnw --settings release-train-settings.xml resolves correctly.
        cp "${workspace}/.github/actions/release-train-settings.xml" "_gen_repo/release-train-settings.xml"
        echo "  release-train-settings.xml: copied to repo root"

    - name: Run workflow generator
      shell: bash
      working-directory: _gen_repo
      run: |
        java -jar ../_gen_generator.jar \
          "--workflow.generator.project.java.versions.primary=${{ inputs.primary-jdk }}" \
          "--workflow.generator.workflows.release-train.build.env.COMMERCIAL_REPO_USERNAME=secrets.COMMERCIAL_ARTIFACTORY_USERNAME" \
          "--workflow.generator.workflows.release-train.build.env.COMMERCIAL_REPO_PASSWORD=secrets.COMMERCIAL_ARTIFACTORY_PASSWORD" \
          "--workflow.generator.workflows.release-train.test.env.COMMERCIAL_REPO_USERNAME=secrets.COMMERCIAL_ARTIFACTORY_USERNAME" \
          "--workflow.generator.workflows.release-train.test.env.COMMERCIAL_REPO_PASSWORD=secrets.COMMERCIAL_ARTIFACTORY_PASSWORD"

    - name: Commit and push changes
      id: commit
      shell: bash
      working-directory: _gen_repo
      run: |
        git add .github/ release-train-settings.xml
        if git diff --staged --quiet; then
          echo "No changes to commit for ${{ inputs.repo }}@${{ inputs.branch }}."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Update generated GitHub Actions workflow files [skip actions]"
          git push
          echo "Changes pushed to ${{ inputs.repo }}@${{ inputs.branch }}."
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

name: 'Sync Deploy Docs Workflow'
description: 'Writes the shared deploy-docs caller workflow to a repository docs-build branch'
author: 'Spring Cloud Team'

inputs:
  repository:
    description: 'Repository to update (format: org/repo-name)'
    required: true
  branch:
    description: 'Branch holding the docs build'
    required: false
    default: 'docs-build'
  template-path:
    description: 'Path to the caller template within this repository'
    required: false
    default: 'examples/deploy-docs.yml'
  actions-ref:
    description: 'Ref of spring-cloud-github-actions the generated caller should point at'
    required: false
    default: 'main'
  token:
    description: 'GitHub token with contents: write permission on the repository'
    required: true
  dry-run:
    description: 'Render and diff the change without committing, pushing, or enabling'
    required: false
    default: 'false'
  enable-workflow:
    description: 'Enable the deploy-docs workflow if it is disabled. Note that GitHub keys a workflow by path, so this also re-enables the trigger workflow of the same name on the source branches.'
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message. Keep [skip actions] unless you intend the push to trigger a docs build.'
    required: false
    default: 'Use shared deploy-docs workflow [skip actions]'
  git-user-name:
    description: 'Git author name for the commit'
    required: false
    default: 'Spring Builds'
  git-user-email:
    description: 'Git author email for the commit'
    required: false
    default: 'svc.spring-builds@broadcom.com'

outputs:
  changed:
    description: 'true if the workflow file was created or updated'
    value: ${{ steps.sync.outputs.changed }}
  status:
    description: 'One of: created, updated, unchanged, skipped-no-branch'
    value: ${{ steps.sync.outputs.status }}
  workflow-state:
    description: 'Result of the enable step: enabled, already-active, would-enable (...), not-registered, or not-checked'
    value: ${{ steps.sync.outputs.workflow-state }}

runs:
  using: 'composite'
  steps:
    - name: Sync deploy-docs workflow
      id: sync
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
        TEMPLATE_PATH: ${{ inputs.template-path }}
        ACTIONS_REF: ${{ inputs.actions-ref }}
        DRY_RUN: ${{ inputs.dry-run }}
        ENABLE_WORKFLOW: ${{ inputs.enable-workflow }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        TARGET_FILE='.github/workflows/deploy-docs.yml'

        echo "=== Sync Deploy Docs Workflow ==="
        echo "Repository:  $REPO"
        echo "Branch:      $BRANCH"
        echo "Actions ref: $ACTIONS_REF"
        echo "Dry run:     $DRY_RUN"
        echo ""

        if [[ ! -f "$TEMPLATE_PATH" ]]; then
          echo "::error::Template '${TEMPLATE_PATH}' not found in this repository."
          exit 1
        fi

        # Render the caller from the template: drop the example-only header
        # comment, prepend a generated-by banner, and point the `uses:` line at
        # the requested ref. The template is the single source of truth so the
        # example and what actually ships cannot drift.
        RENDERED="$(mktemp)"
        {
          echo "# Generated by the rollout-deploy-docs workflow in"
          echo "# spring-cloud/spring-cloud-github-actions."
          echo "#"
          echo "# Do not edit this file directly - update examples/deploy-docs.yml there"
          echo "# and re-run the rollout, otherwise your change will be overwritten."
          echo ""
          sed -n '/^name:/,$p' "$TEMPLATE_PATH" \
            | sed "s|\(spring-cloud-github-actions/\.github/workflows/deploy-docs\.yml@\)[^ ]*|\1${ACTIONS_REF}|" \
            | sed "s|^\(    branches: \).*|\1${BRANCH}|"
        } > "$RENDERED"

        if ! grep -q "deploy-docs.yml@${ACTIONS_REF}" "$RENDERED"; then
          echo "::error::Rendered caller does not reference deploy-docs.yml@${ACTIONS_REF} - check the template."
          exit 1
        fi

        # actions/checkout writes an `http.https://github.com/.extraheader`
        # credential into the *local* git config of the repository it checks
        # out, and that header takes precedence over credentials embedded in a
        # remote URL. Running from inside that checkout would authenticate
        # every git call below as the caller's GITHUB_TOKEN rather than the
        # token given to this action - which succeeds for public repositories
        # and fails for private ones. Work from outside the checkout instead.
        WORKDIR="$(mktemp -d)"
        cd "$WORKDIR"

        REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

        # Without --exit-code, ls-remote returns 0 and prints nothing when the
        # branch is absent, so a non-zero status here means the repository was
        # unreachable (bad or under-scoped token, network, renamed repo). Those
        # are reported as errors rather than silently as "no branch".
        set +e
        HEADS="$(git ls-remote --heads "$REMOTE_URL" "refs/heads/${BRANCH}" 2>&1)"
        LS_RC=$?
        set -e

        if [[ $LS_RC -ne 0 ]]; then
          echo "::error::Could not read ${REPO}: ${HEADS//${GH_TOKEN}/<token>}"
          exit 1
        fi

        if [[ -z "$HEADS" ]]; then
          echo "No '${BRANCH}' branch in ${REPO} - nothing to do."
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          echo 'status=skipped-no-branch' >> "$GITHUB_OUTPUT"
          echo 'workflow-state=not-checked' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git clone --quiet --depth 1 --single-branch --branch "$BRANCH" \
          "$REMOTE_URL" "${WORKDIR}/repo"

        cd "${WORKDIR}/repo"

        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"

        if [[ -f "$TARGET_FILE" ]]; then
          STATUS='updated'
        else
          STATUS='created'
        fi

        mkdir -p "$(dirname "$TARGET_FILE")"
        cp "$RENDERED" "$TARGET_FILE"

        git add "$TARGET_FILE"

        if git diff --cached --quiet; then
          echo "${TARGET_FILE} on '${BRANCH}' is already up to date."
          CHANGED='false'
          STATUS='unchanged'
        else
          echo "--- diff ---"
          git --no-pager diff --cached
          echo "--- end diff ---"

          CHANGED='true'

          if [[ "$DRY_RUN" == 'true' ]]; then
            echo ""
            echo "Dry run - not committing or pushing. Would have ${STATUS} ${TARGET_FILE}."
          else
            # The caller workflow triggers on `push` to this branch, so the
            # commit message must keep a skip token unless a docs build is
            # wanted.
            if [[ "$COMMIT_MESSAGE" != *'[skip actions]'* && "$COMMIT_MESSAGE" != *'[skip ci]'* ]]; then
              echo "::warning::Commit message has no skip token - this push will trigger a docs build in ${REPO}."
            fi

            git commit --quiet -m "$COMMIT_MESSAGE"
            git push --quiet origin "$BRANCH"
            echo "${TARGET_FILE} ${STATUS} on '${BRANCH}' in ${REPO}."
          fi
        fi

        # ---------------------------------------------------------------------
        # Enable the workflow.
        #
        # Runs even when the file was already up to date, since a correct file
        # in a disabled workflow still never builds. GitHub keys a workflow by
        # its path, so this single entity also covers the trigger workflow of
        # the same name on the source branches.
        # ---------------------------------------------------------------------
        WORKFLOW_STATE='not-checked'

        if [[ "$ENABLE_WORKFLOW" == 'true' ]]; then
          WORKFLOW_ID="$(gh api "repos/${REPO}/actions/workflows" --paginate \
            --jq ".workflows[] | select(.path == \"${TARGET_FILE}\") | .id" 2>/dev/null | head -1 || true)"

          if [[ -z "$WORKFLOW_ID" ]]; then
            # A newly created file is not registered until GitHub indexes it.
            echo "::warning::No workflow registered at ${TARGET_FILE} in ${REPO} yet - cannot check its state. Re-run the rollout to enable it."
            WORKFLOW_STATE='not-registered'
          else
            CURRENT_STATE="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}" --jq '.state')"
            echo "Workflow ${WORKFLOW_ID} state: ${CURRENT_STATE}"

            if [[ "$CURRENT_STATE" == 'active' ]]; then
              WORKFLOW_STATE='already-active'
            elif [[ "$DRY_RUN" == 'true' ]]; then
              echo "Dry run - would enable workflow ${WORKFLOW_ID} (currently ${CURRENT_STATE})."
              WORKFLOW_STATE="would-enable (${CURRENT_STATE})"
            else
              gh api -X PUT "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/enable" --silent
              VERIFIED="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}" --jq '.state')"
              if [[ "$VERIFIED" == 'active' ]]; then
                echo "Enabled workflow ${WORKFLOW_ID} in ${REPO} (was ${CURRENT_STATE})."
                WORKFLOW_STATE='enabled'
              else
                echo "::error::Tried to enable workflow ${WORKFLOW_ID} in ${REPO} but it is still '${VERIFIED}'."
                exit 1
              fi
            fi
          fi
        fi

        echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
        echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
        echo "workflow-state=${WORKFLOW_STATE}" >> "$GITHUB_OUTPUT"

branding:
  icon: 'upload-cloud'
  color: 'green'

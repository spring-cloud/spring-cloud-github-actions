name: 'Dependabot Scan'
description: >
  Scans one repository for open Dependabot pull requests and the current state of its
  Dependabot update jobs, classifies each PR, and writes the result as JSON. Read-only,
  so it is shared by the reporting and triage workflows.

inputs:
  repo:
    description: 'Full repository path (e.g. spring-cloud/spring-cloud-build)'
    required: true
  project:
    description: 'Spring Cloud project key (e.g. spring-cloud-build)'
    required: true
  type:
    description: 'Repository flavor: oss or commercial'
    required: true
  maintained-branches:
    description: >
      Comma-separated branches this repo actively maintains, from projects.json
      (branches.scheduled). A PR against anything else is reported as invalid.
      Comma-separated rather than JSON because a matrix cannot carry structured data
      through an expression without toJson pretty-printing it and breaking the YAML.
    required: true
  extra-branches:
    description: >
      Comma-separated branches that are maintained but are not release branches, so they
      never appear in projects.json. Dependabot legitimately targets these.
    required: false
    default: 'docs-build'
  stale-days:
    description: >
      A failed Dependabot update job older than this many days is reported as stale rather
      than as currently failing - its scope has stopped running (a retired branch, or a
      one-off targeted update), so its last conclusion says nothing about today.
    required: false
    default: '14'
  releaser-map-file:
    description: >
      Path to a JSON file of {type: {project: {version: train}}}, used to resolve which
      GitHub Project a PR belongs to. Empty disables project resolution.
    required: false
    default: ''
  token:
    description: 'GitHub token with read access to the repository'
    required: true

outputs:
  result-file:
    description: 'Path of the JSON file written'
    value: ${{ steps.scan.outputs.result-file }}
  safe-name:
    description: 'Filename-safe form of the repo, for artifact naming'
    value: ${{ steps.scan.outputs.safe-name }}

runs:
  using: composite
  steps:
    - name: Scan repository
      id: scan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PROJECT: ${{ inputs.project }}
        TYPE: ${{ inputs.type }}
        MAINTAINED_BRANCHES: ${{ inputs.maintained-branches }}
        EXTRA_BRANCHES: ${{ inputs.extra-branches }}
        STALE_DAYS: ${{ inputs.stale-days }}
        RELEASER_MAP_FILE: ${{ inputs.releaser-map-file }}
      run: |
        node - << 'JSEOF'
        const fs = require('fs');
        const { execFileSync } = require('child_process');

        const REPO = process.env.REPO;
        const PROJECT = process.env.PROJECT;
        const TYPE = process.env.TYPE;

        const parseJson = (raw, fallback) => {
          try { return JSON.parse(raw); } catch (_) { return fallback; }
        };

        const toSet = raw =>
          new Set((raw || '').split(',').map(b => b.trim()).filter(Boolean));

        // Release branches carry a real project version, so their PRs get a milestone and
        // a project board. Extra branches (docs-build) are maintained but are not part of
        // any release train - they hold a placeholder version like 0.0.1-SNAPSHOT, which
        // would otherwise be turned into a demand for a nonexistent "0.0.1" milestone.
        // Both count as maintained; only release branches get those checks.
        const releaseBranches = toSet(process.env.MAINTAINED_BRANCHES);
        const extraBranches = toSet(process.env.EXTRA_BRANCHES);
        const maintained = new Set([...releaseBranches, ...extraBranches]);

        // {type: {project: {version: train}}}, written once by the calling workflow so
        // the releaser config is fetched a single time rather than once per repo.
        let releaserMap = {};
        const mapFile = (process.env.RELEASER_MAP_FILE || '').trim();
        if (mapFile && fs.existsSync(mapFile)) {
          const all = parseJson(fs.readFileSync(mapFile, 'utf8'), {}) || {};
          releaserMap = (all[TYPE] || {})[PROJECT] || {};
        }

        const gh = args => {
          try {
            return { ok: true, out: execFileSync('gh', args,
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 1 << 26 }) };
          } catch (err) {
            return { ok: false, out: '', err: (err.stderr || err.message || '').split('\n')[0].trim() };
          }
        };

        // GitHub's API - the GraphQL endpoint behind `gh pr list` especially - returns
        // the occasional 502/504. Without a retry those surface as "0 open PRs", which
        // reads as good news and is the most dangerous way for this report to be wrong.
        const ghRetry = (args, attempts = 3) => {
          let last;
          for (let attempt = 1; attempt <= attempts; attempt++) {
            last = gh(args);
            if (last.ok) return last;
            if (attempt < attempts) {
              console.log(`  attempt ${attempt} failed (${last.err}) - retrying`);
              execFileSync('sleep', [String(attempt * 3)]);
            }
          }
          return last;
        };

        const warnings = [];

        // ── Is the repository readable at all? ──────────────────────────────────────
        // `gh pr list` answers with an empty array and exit 0 for a repository it cannot
        // see, so a renamed, deleted or permission-denied repo would otherwise be
        // reported as simply having no open Dependabot PRs. One explicit existence check
        // turns that silent zero into a visible error.
        const repoResp = ghRetry(['api', `repos/${REPO}`, '--jq', '.full_name']);
        const repoUnreadable = !repoResp.ok;
        if (repoUnreadable) {
          warnings.push(`repository is not readable: ${repoResp.err}`);
        }

        // ── Dependabot update jobs ──────────────────────────────────────────────────
        // Dependabot's own update runs surface as normal workflow runs with
        // event=dynamic and path=dynamic/dependabot/dependabot-updates. The run name
        // encodes the ecosystem and directory, e.g. "maven in /. - Update #1510829977".
        // Run names come in two shapes:
        //   "maven in /. - Update #123"                       recurring, whole ecosystem
        //   "maven in /. for org.bouncycastle:bcprov - Update #123"   one-off, one dependency
        // The second is what a security advisory or an @dependabot recreate produces.
        // Declared out here because the confirmation pass below parses names too.
        const NAME = /^(\S+) in (\S+?)(?: for (.+?))? - Update #(\d+)$/;

        // Strip the trailing id even when the name does not parse, so an unknown format
        // degrades to one group per scope rather than one per run.
        const scopeOf = run => {
          const m = (run.name || '').match(NAME);
          return {
            ecosystem: m ? m[1] : (run.name || 'unknown').replace(/ - Update #\d+$/, ''),
            directory: m ? m[2] : '?',
            dependency: m && m[3] ? m[3] : null,
          };
        };

        const updateJobs = [];
        let updateJobsFailed = false;
        const runsResp = ghRetry(['api',
          `repos/${REPO}/actions/runs?actor=dependabot%5Bbot%5D&event=dynamic&per_page=100`]);
        if (!runsResp.ok) {
          updateJobsFailed = true;
          warnings.push(`could not list Dependabot update runs: ${runsResp.err}`);
        } else {
          const runs = parseJson(runsResp.out, {}).workflow_runs || [];

          // Runs come back newest-first, so the first entry seen for a given
          // ecosystem/directory/branch is that scope's current state. Older runs for the
          // same key are history - the question is "is this update broken now?", not
          // "has it ever failed?".
          //
          // The key deliberately excludes the dependency, so a one-off targeted run
          // shares a group with the recurring runs covering the same scope. Keying on it
          // instead would give every targeted run a group of its own, in which it is
          // permanently the latest run - so a single failure would be reported as
          // currently-failing forever, since nothing of that exact name ever runs again.
          const seen = new Set();
          for (const run of runs) {
            const { ecosystem, directory, dependency } = scopeOf(run);
            const key = `${ecosystem}|${directory}|${run.head_branch}`;
            if (seen.has(key)) continue;
            seen.add(key);
            updateJobs.push({
              ecosystem, directory, dependency,
              branch: run.head_branch,
              status: run.status,
              conclusion: run.conclusion || 'none',
              url: run.html_url,
              createdAt: run.created_at,
            });
          }
        }

        // A scope whose last run is long past is not evidence about today. Retired
        // branches are the common case: their updates stop for good, so a final failed
        // run would otherwise be reported every day from then on. Those are separated
        // out rather than dropped, so a genuinely stalled scope is still visible.
        const staleDays = Number(process.env.STALE_DAYS || '14');
        const staleBefore = Date.now() - staleDays * 86400000;
        const isStale = j => new Date(j.createdAt).getTime() < staleBefore;

        const failed = updateJobs.filter(j => j.conclusion === 'failure');

        // ── Confirm every failure before reporting it ───────────────────────────────
        // The runs list is eventually consistent and intermittently serves a page days
        // out of date. Observed directly: two identical requests seconds apart returned
        // 2026-08-17 and 2026-08-27 as the newest run for the same scope, and one report
        // announced three circuitbreaker-commercial failures from 2026-08-18 when four
        // later successes - including one seven hours before the report ran - already
        // existed. Seven of that report's twelve failures were already superseded.
        //
        // ghRetry does not help: it retries a *failed* call, and a stale page is a 200.
        // The fix is a second, independent read per failing scope, filtered by branch so
        // it cannot be answered by a cached page for the unfiltered query. A failure is
        // reported only if it is still the newest run for its scope; if a later run
        // exists, that run's own conclusion is what gets reported.
        //
        // Only failures are re-read. Staleness in the other direction - a stale success
        // hiding a real failure - is possible in principle, but confirming every green
        // scope would multiply the request count for the case that under-reports rather
        // than cries wolf. See the note in README-dependabot-report.md.
        const liveNewest = job => {
          const resp = ghRetry(['api', `repos/${REPO}/actions/runs` +
            `?event=dynamic&branch=${encodeURIComponent(job.branch)}&per_page=100`]);
          if (!resp.ok) return { error: resp.err };
          const runs = parseJson(resp.out, {}).workflow_runs || [];
          for (const run of runs) {
            const { ecosystem, directory } = scopeOf(run);
            if (ecosystem === job.ecosystem && directory === job.directory
                && run.head_branch === job.branch) return { run };
          }
          // No run at all for this scope in the branch-filtered view contradicts the
          // first read. Treated as unconfirmable rather than as proof of anything.
          return { error: 'scope not present in the branch-filtered run list' };
        };

        const confirmedFailures = [];
        const supersededUpdateJobs = [];
        for (const job of failed) {
          const { run, error } = liveNewest(job);
          if (error) {
            // Unconfirmable: keep the failure rather than quietly dropping it, but say so.
            warnings.push(`could not confirm ${job.ecosystem}|${job.directory}|${job.branch} ` +
              `is still failing: ${error}`);
            confirmedFailures.push({ ...job, unconfirmed: true });
            continue;
          }
          const newer = new Date(run.created_at).getTime() > new Date(job.createdAt).getTime();
          if (!newer) { confirmedFailures.push(job); continue; }

          // A later run exists, so the first read was stale. Report what is actually
          // current for this scope - which may still be a failure, just a different one.
          const live = { ...job, status: run.status, conclusion: run.conclusion || 'none',
                         url: run.html_url, createdAt: run.created_at };
          // A run still in flight has no conclusion yet. It supersedes the failure all
          // the same - the old run is no longer this scope's current state - and if the
          // new one fails, the next report says so. Labelled rather than reported as a
          // bare "none", which reads like missing data.
          const outcome = live.status === 'completed' ? live.conclusion : `${live.status} (no result yet)`;
          if (live.conclusion === 'failure') {
            confirmedFailures.push(live);
          } else {
            supersededUpdateJobs.push({ ...job, supersededBy: live.createdAt,
                                        supersededConclusion: outcome });
          }
          console.log(`  stale read corrected: ${job.ecosystem}|${job.directory}|${job.branch} ` +
            `${job.createdAt} ${job.conclusion} -> ${live.createdAt} ${outcome}`);
        }

        // Recomputed from the confirmed timestamps, not the stale ones: a failure whose
        // real newest run is months old is stale, however fresh the first read claimed.
        const failingUpdateJobs = confirmedFailures.filter(j => !isStale(j));
        const staleUpdateJobs = confirmedFailures.filter(isStale)
          .map(j => ({ ...j, ageDays: Math.floor((Date.now() - new Date(j.createdAt).getTime()) / 86400000) }));

        // ── Open Dependabot pull requests ───────────────────────────────────────────
        const PR_FIELDS = 'number,title,url,baseRefName,headRefName,createdAt,updatedAt,' +
          'headRefOid,mergeable,mergeStateStatus,statusCheckRollup,milestone';

        const listPrs = () => {
          const r = ghRetry(['pr', 'list', '--repo', REPO, '--author', 'app/dependabot',
            '--state', 'open', '--limit', '100', '--json', PR_FIELDS]);
          if (!r.ok) {
            warnings.push(`could not list Dependabot PRs: ${r.err}`);
            return null;
          }
          return parseJson(r.out, []);
        };

        // A repo whose PR list could not be read is reported as unscannable rather than
        // as having no open PRs - see prListFailed in the result below.
        let prs = listPrs();
        const prListFailed = prs === null;
        if (prListFailed) prs = [];

        // GitHub computes mergeability lazily and returns UNKNOWN until it has. Asking
        // for the PR is itself what triggers the computation, so a single re-read a few
        // seconds later resolves it in practice.
        if (prs.some(pr => pr.mergeable === 'UNKNOWN')) {
          execFileSync('sleep', ['5']);
          const retried = listPrs();
          if (retried) prs = retried;
        }

        // A check is either a CheckRun (status + conclusion) or a legacy StatusContext
        // (state). Both appear in statusCheckRollup, so they are normalised to one shape.
        const FAILING = new Set(['FAILURE', 'TIMED_OUT', 'ERROR', 'STARTUP_FAILURE', 'CANCELLED']);
        const PASSING = new Set(['SUCCESS', 'NEUTRAL', 'SKIPPED']);

        const normalizeCheck = c => {
          if (c.__typename === 'StatusContext' || c.state) {
            return { name: c.context || 'status', state: (c.state || '').toUpperCase(), url: c.targetUrl || '' };
          }
          const status = (c.status || '').toUpperCase();
          if (status && status !== 'COMPLETED') {
            return { name: c.name || 'check', state: 'PENDING', url: c.detailsUrl || '' };
          }
          return { name: c.name || 'check', state: (c.conclusion || 'PENDING').toUpperCase(), url: c.detailsUrl || '' };
        };

        // Project version of a branch: strip <parent> so its <version> is not mistaken
        // for the project's own, then take the first <version> that remains.
        const versionCache = new Map();
        const branchVersion = branch => {
          if (versionCache.has(branch)) return versionCache.get(branch);
          let version = null;
          const r = gh(['api', `repos/${REPO}/contents/pom.xml?ref=${branch}`, '--jq', '.content']);
          if (r.ok) {
            const pom = Buffer.from(r.out.trim(), 'base64').toString('utf8');
            const m = pom.replace(/<parent>[\s\S]*?<\/parent>/, '').match(/<version>([^<]+)<\/version>/);
            if (m) version = m[1].trim();
          }
          versionCache.set(branch, version);
          return version;
        };

        // Existing milestone titles, fetched once and reused for every PR in this repo.
        let milestoneTitles = null;
        const milestoneExists = title => {
          if (milestoneTitles === null) {
            // --paginate, with --slurp instead of --jq because gh refuses both together:
            // a repository past a hundred open milestones would otherwise lose the newest
            // ones, and those are the only ones this ever looks for.
            const r = gh(['api', '--paginate', '--slurp',
              `repos/${REPO}/milestones?state=open&per_page=100`]);
            milestoneTitles = r.ok
              ? new Set(parseJson(r.out, []).flat().map(m => m.title))
              : new Set();
            if (!r.ok) warnings.push(`could not list milestones: ${r.err}`);
          }
          return milestoneTitles.has(title);
        };

        const scanned = prs.map(pr => {
          const checks = (pr.statusCheckRollup || []).map(normalizeCheck);
          const failing = checks.filter(c => FAILING.has(c.state));
          const pending = checks.filter(c => !FAILING.has(c.state) && !PASSING.has(c.state));

          const isMaintained = maintained.has(pr.baseRefName);

          // First match wins.
          //
          // The order matters most for retired branches: those are locked, so their PRs
          // report mergeStateStatus BLOCKED even with every check green. Testing
          // maintenance first keeps a locked branch from ever being described in terms
          // of its checks - the actionable fact is that the branch is gone.
          //
          // Checks are read from statusCheckRollup rather than inferred from
          // mergeStateStatus, which conflates too many causes to be useful here.
          // A green PR that GitHub still refuses to merge (branch protection, an
          // unreported required check) is called "blocked" rather than "ready", so that
          // everything reported as ready can genuinely be merged.
          let state;
          if (!isMaintained) state = 'unmaintained';
          else if (pr.mergeable === 'CONFLICTING') state = 'conflicting';
          else if (failing.length) state = 'failing';
          else if (pending.length) state = 'pending';
          else if (pr.mergeable !== 'MERGEABLE') state = 'unknown';
          else if (pr.mergeStateStatus === 'BLOCKED') state = 'blocked';
          else state = 'ready';

          // Milestone and project only apply to release branches - a docs-build PR
          // belongs to no train and needs neither, so both stay 'n/a' and it is never
          // reported as missing a milestone or having an unresolvable project.
          let expectedMilestone = null, milestoneState = 'n/a';
          let expectedProject = null, projectState = 'n/a';

          if (releaseBranches.has(pr.baseRefName)) {
            const version = branchVersion(pr.baseRefName);
            if (!version) {
              milestoneState = 'unresolved';
              projectState = 'unresolved';
            } else {
              expectedMilestone = version.replace(/-SNAPSHOT$/, '');
              const current = pr.milestone?.title || null;
              if (current === expectedMilestone) milestoneState = 'set';
              else if (current) milestoneState = 'mismatch';
              else if (!milestoneExists(expectedMilestone)) milestoneState = 'missing';
              else milestoneState = 'unset';

              // Boards are OSS-only by design; commercial PRs get a milestone alone.
              if (TYPE === 'oss') {
                expectedProject = releaserMap[version] || null;
                projectState = expectedProject ? 'resolved' : 'unresolved';
              }
            }
          }

          // Dependabot encodes the ecosystem in its branch name -
          // dependabot/<ecosystem>/<path>/<dependency>-<version> - which is the only
          // reliable place to read it from: the PR title names the dependency, not what
          // manages it.
          const ecoMatch = (pr.headRefName || '').match(/^dependabot\/([^/]+)\//);

          return {
            number: pr.number,
            title: pr.title,
            url: pr.url,
            baseRefName: pr.baseRefName,
            headRefName: pr.headRefName,
            ecosystem: ecoMatch ? ecoMatch[1] : null,
            isReleaseBranch: releaseBranches.has(pr.baseRefName),
            createdAt: pr.createdAt,
            headRefOid: pr.headRefOid,
            mergeable: pr.mergeable,
            mergeStateStatus: pr.mergeStateStatus,
            currentMilestone: pr.milestone?.title || null,
            state,
            failingChecks: failing.map(c => c.name),
            pendingChecks: pending.map(c => c.name),
            expectedMilestone, milestoneState,
            expectedProject, projectState,
          };
        });

        const countOf = s => scanned.filter(p => p.state === s).length;
        const counts = {
          open: scanned.length,
          ready: countOf('ready'),
          blocked: countOf('blocked'),
          failing: countOf('failing'),
          conflicting: countOf('conflicting'),
          pending: countOf('pending'),
          unknown: countOf('unknown'),
          unmaintained: countOf('unmaintained'),
        };

        const result = {
          project: PROJECT, repo: REPO, type: TYPE,
          counts,
          repoUnreadable,
          prListFailed,
          updateJobsFailed,
          updateJobsChecked: updateJobs.length,
          failingUpdateJobs,
          staleUpdateJobs,
          supersededUpdateJobs,
          prs: scanned,
          warnings,
        };

        const safe = `${REPO}`.replace(/\//g, '-');
        const file = `result-${safe}.json`;
        fs.writeFileSync(file, JSON.stringify(result, null, 2));

        console.log(`${REPO}: ${counts.open} open PR(s) - ` +
          `${counts.ready} ready, ${counts.blocked} blocked, ${counts.failing} failing, ` +
          `${counts.conflicting} conflicting, ${counts.pending} pending, ` +
          `${counts.unknown} unknown, ${counts.unmaintained} unmaintained`);
        console.log(`${REPO}: ${failingUpdateJobs.length} failing update job(s) of ${updateJobs.length} tracked` +
          (staleUpdateJobs.length ? ` (${staleUpdateJobs.length} stale failure(s) ignored)` : '') +
          (supersededUpdateJobs.length
            ? ` (${supersededUpdateJobs.length} already superseded by a later run - stale read corrected)`
            : ''));
        for (const w of warnings) console.log(`  warning: ${w}`);

        fs.appendFileSync(process.env.GITHUB_OUTPUT, `result-file=${file}\n`);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `safe-name=${safe}\n`);
        JSEOF

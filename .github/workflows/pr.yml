name: Build

on:
  workflow_call:
    inputs:
      custom_build_command:
        description: 'Custom run command for the Build and Deploy step (overrides default Maven command)'
        required: false
        type: string
    secrets:
      ARTIFACTORY_USERNAME:
        required: false
      ARTIFACTORY_PASSWORD:
        required: false

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: set env variables
        env:
          RO_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          RO_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        uses: spring-cloud/spring-cloud-github-actions/.github/actions/set-commercial-creds-env-vars@v1.1.0
      - name: Set Maven flags
        run: |
          MAVEN_FLAGS=""
          if [[ "${{ runner.debug }}" == "1" ]]; then
            MAVEN_FLAGS="-X"
          fi
          echo "MAVEN_FLAGS=$MAVEN_FLAGS" >> $GITHUB_ENV
      - name: Build with Maven
        if: ${{ inputs.custom_build_command == '' }}
        run: ./mvnw -s .settings.xml clean install -B -U -Pspring ${{ env.MAVEN_FLAGS }}
      - name: Custom build command
        if: ${{ inputs.custom_build_command != '' }}
        env:
          CUSTOM_BUILD_COMMAND: ${{ inputs.custom_build_command }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        run: |
          # Execute custom build command provided by caller
          printf '%s\n' "$CUSTOM_BUILD_COMMAND" > /tmp/build-deploy.sh
          chmod +x /tmp/build-deploy.sh
          bash /tmp/build-deploy.sh
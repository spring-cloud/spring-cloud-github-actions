name: Test - Maven Wrapper Properties

# Unit tests for .github/scripts/maven-wrapper-properties.js, the shared rules both halves
# of update-maven-wrapper.yml edit maven-wrapper.properties by.
#
# There is deliberately no "dist is up to date" job here, unlike the tests for the actions
# under .github/actions. Those are node20 actions with npm dependencies: they run from a
# consumer's checkout with no install step, so ncc has to bundle them into dist/index.js.
# This file is neither - it has no dependencies and no action.yml, and is required directly
# by the inline node scripts in the workflow after this repo is checked out. Bundling it
# would produce an identical file and one more way for CI to fail.

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-maven-wrapper.yml'
      - '.github/workflows/test-maven-wrapper-properties.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-maven-wrapper.yml'
      - '.github/workflows/test-maven-wrapper-properties.yml'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  # ── The workflow's own inline scripts ───────────────────────────────────────
  # The scripts that use this library live inside YAML heredocs, where a syntax error is
  # invisible until the workflow runs against a real repository. Extracting and parsing
  # them here turns that into a pull-request failure instead.
  inline-scripts:
    name: Workflow inline scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and syntax-check every inline node block
        run: |
          set -euo pipefail
          WF=.github/workflows/update-maven-wrapper.yml
          OUT=$(mktemp -d)
          awk -v out="$OUT" '
            /^ +node - << .JSEOF.$/ { n++; f = out "/block-" n ".js"; inblock = 1; next }
            inblock && /^ +JSEOF$/   { inblock = 0; next }
            inblock                  { sub(/^          /, ""); print > f }
          ' "$WF"

          count=$(ls "$OUT" | wc -l | tr -d ' ')
          echo "Extracted ${count} inline node block(s) from ${WF}"

          # Guards against the extraction silently matching nothing if the heredoc marker
          # or indentation is ever changed - which would turn this job into a no-op that
          # always passes.
          if [ "${count}" -lt 5 ]; then
            echo "❌ expected at least 5 blocks; the heredoc markers may have changed"
            exit 1
          fi

          for f in "${OUT}"/*.js; do
            node --check "$f"
            echo "  ✅ $(basename "$f")"
          done

      - name: Verify the library loads and exports what the workflow uses
        run: |
          node -e '
            const W = require("./.github/scripts/maven-wrapper-properties.js");
            const used = ["wrapperDirs", "propsPath", "scriptPaths", "currentMaven",
                          "dependabotWrapperVersion", "rewrite", "cmp"];
            const missing = used.filter(n => typeof W[n] !== "function");
            if (missing.length) {
              console.log(`❌ missing exports the workflow calls: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`✅ all ${used.length} exports the workflow calls are present`);
          '
